name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to {AppName}-debug.apk
        run: |
          # Extract app_name from strings.xml or fallback
          RAW_NAME=$(grep -o '<string name="app_name">.*</string>' app/src/main/res/values/strings.xml | sed -e 's/<[^>]*>//g' || echo "")
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="APK-Builder-Pro"
          fi
          # Sanitize name for filename (replace spaces with hyphens, keep alphanumerics, hyphens and underscores)
          SAFE_APP_NAME=$(echo "$RAW_NAME" | tr ' ' '-' | tr -cd '[:alnum:]-_')
          TARGET_APK_NAME="${SAFE_APP_NAME}-debug.apk"
          
          echo "Extracted App Name: $RAW_NAME"
          echo "Target APK filename: $TARGET_APK_NAME"
          
          OUTPUT_DIR="app/build/outputs/apk/debug"
          mkdir -p "$OUTPUT_DIR"
          
          # Find original debug APK
          ORIGINAL_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$ORIGINAL_APK" ]; then
            echo "Copying $ORIGINAL_APK -> $OUTPUT_DIR/$TARGET_APK_NAME"
            cp "$ORIGINAL_APK" "$OUTPUT_DIR/$TARGET_APK_NAME"
          fi
          
          echo "Final APK files in $OUTPUT_DIR:"
          ls -lah "$OUTPUT_DIR"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Pro-Debug
          path: app/build/outputs/apk/debug/*-debug.apk
          retention-days: 30

